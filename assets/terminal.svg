<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" fill="none">
  <defs>
    <!-- Palette (from logo): night #081114 · deep teal #1b3d3d · teal #2c6a5f · sage #6f9a7a · cream #f3e6cc · copper #d4914f -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c6a5f"/><stop offset="1" stop-color="#6f9a7a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8a868"/><stop offset="1" stop-color="#b8743a"/>
    </linearGradient>
    <linearGradient id="mt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c6a5f"/><stop offset="1" stop-color="#12292a"/>
    </linearGradient>
    <clipPath id="badge"><circle cx="118" cy="178" r="68"/></clipPath>
    <clipPath id="body"><rect x="2" y="41" width="856" height="517"/></clipPath>
    <style>
      text{font:14px/1 ui-monospace,SFMono-Regular,"JetBrains Mono",Consolas,monospace}
      .p{fill:#d4914f}.k{fill:#f3e6cc;font-weight:700}.v{fill:#e6ddc9}.m{fill:#5f7d76}.ok{fill:#7fc29b}.c{fill:#8fbfa8}
      .kw{fill:#d4914f}.id{fill:#f3e6cc}.key{fill:#8fbfa8}.str{fill:#e8c89a}.pn{fill:#5f7d76}.fn{fill:#7fc29b}
      .mono{font:400 64px/1 Georgia,"Times New Roman",serif;fill:#f3e6cc}

      .s{opacity:0;animation:show 0s linear forwards}
      @keyframes show{to{opacity:1}}
      .h{animation:hide 0s linear forwards}
      @keyframes hide{to{opacity:0}}
      .blink{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .ring{animation:ring 5s ease-in-out infinite alternate}
      @keyframes ring{to{stroke-opacity:.4}}
      .spin{transform-origin:35px 489px;animation:spin .8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}

      /* typing: a background-coloured cover with a caret slides right one character at a time */
      .t1{animation:t1 .9s steps(18) .5s forwards}
      .t2{animation:t2 .7s steps(12) 3.2s forwards}
      .t3{animation:t3 1.4s steps(33) 5.9s forwards}
      @keyframes t1{to{transform:translateX(151px)}}
      @keyframes t2{to{transform:translateX(101px)}}
      @keyframes t3{to{transform:translateX(277px)}}
    </style>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="858" height="558" rx="16" fill="#0b1619" stroke="#2c6a5f" stroke-opacity=".8" stroke-width="2"/>
  <rect x="1" y="1" width="858" height="40" rx="16" fill="#102024"/>
  <rect x="1" y="26" width="858" height="15" fill="#102024"/>
  <circle cx="26" cy="21" r="6" fill="#d4914f"/><circle cx="46" cy="21" r="6" fill="#6f9a7a"/><circle cx="66" cy="21" r="6" fill="#2c6a5f"/>
  <text x="430" y="26" text-anchor="middle" class="m">anferomol@github: ~</text>

  <g clip-path="url(#body)">

    <!-- 1 · neofetch -->
    <text y="76"><tspan x="28" class="p">➜</tspan><tspan x="46" class="c">~</tspan><tspan x="62" class="m">$</tspan><tspan x="80" class="v">neofetch --profile</tspan></text>
    <g class="t1"><rect x="80" y="62" width="9" height="18" fill="#d4914f" class="h" style="animation-delay:1.5s"/><rect x="89" y="60" width="800" height="22" fill="#0b1619"/></g>

    <g class="s" style="animation-delay:1.6s">
      <g clip-path="url(#badge)">
        <rect x="50" y="110" width="136" height="136" fill="#0a1518"/>
        <circle cx="146" cy="150" r="18" fill="url(#sun)"/>
        <path d="M78 142h24M90 136h18" stroke="#d4914f" stroke-width="2" stroke-linecap="round"/>
        <path d="M50 228l40-54 22 22 28-40 50 72Z" fill="url(#mt)"/>
        <path d="M50 236q34-20 68-4t68-6V250H50Z" fill="#1f4a47"/>
        <text class="mono" x="118" y="202" text-anchor="middle">AR</text>
        <g transform="translate(118 228)" stroke="#6f9a7a" stroke-width="1.6" stroke-linecap="round">
          <path d="M0 10V-10M0-5l-4-4M0-5l4-4M0 1l-6-4M0 1l6-4M0 7l-7-4M0 7l7-4"/>
        </g>
      </g>
      <circle class="ring" cx="118" cy="178" r="68" stroke="url(#g)" stroke-width="4"/>
      <circle cx="118" cy="178" r="74" stroke="#2c6a5f" stroke-opacity=".35" stroke-width="1.2"/>
    </g>

    <g transform="translate(232 0)">
      <text y="112" class="s" style="animation-delay:1.7s"><tspan class="k">anferomol</tspan><tspan class="m">@</tspan><tspan class="k">github</tspan></text>
      <text y="128" class="m s" style="animation-delay:1.75s">────────────────────────────</text>
      <text y="152" class="s" style="animation-delay:1.85s"><tspan class="c">OS</tspan><tspan x="72" class="v">Curiosity v∞ (x86_64)</tspan></text>
      <text y="172" class="s" style="animation-delay:1.95s"><tspan class="c">Role</tspan><tspan x="72" class="v">Builder · IT enthusiast</tspan></text>
      <text y="192" class="s" style="animation-delay:2.05s"><tspan class="c">Uptime</tspan><tspan x="72" class="v">Always learning</tspan></text>
      <text y="212" class="s" style="animation-delay:2.15s"><tspan class="c">Shell</tspan><tspan x="72" class="v">coffee.sh ☕</tspan></text>
      <text y="232" class="s" style="animation-delay:2.25s"><tspan class="c">Status</tspan><tspan x="72" class="ok">● Open to collaborate</tspan></text>
      <g class="s" style="animation-delay:2.4s">
        <rect x="0" y="246" width="20" height="12" fill="#081114" stroke="#2c6a5f"/><rect x="24" y="246" width="20" height="12" fill="#1b3d3d"/>
        <rect x="48" y="246" width="20" height="12" fill="#2c6a5f"/><rect x="72" y="246" width="20" height="12" fill="#6f9a7a"/>
        <rect x="96" y="246" width="20" height="12" fill="#f3e6cc"/><rect x="120" y="246" width="20" height="12" fill="#d4914f"/>
      </g>
    </g>

    <!-- 2 · cat about.ts -->
    <g class="s" style="animation-delay:2.8s">
      <text y="296"><tspan x="28" class="p">➜</tspan><tspan x="46" class="c">~</tspan><tspan x="62" class="m">$</tspan><tspan x="80" class="v">cat about.ts</tspan></text>
    </g>
    <g class="t2"><rect x="80" y="282" width="9" height="18" fill="#d4914f" class="h" style="animation-delay:4s"/><rect x="89" y="280" width="800" height="22" fill="#0b1619"/></g>

    <text y="324" class="s" style="animation-delay:4.1s"><tspan x="28" class="kw">const</tspan><tspan class="id"> anferomol</tspan><tspan class="pn"> = {</tspan></text>
    <text y="344" class="s" style="animation-delay:4.25s"><tspan x="46" class="key">passion</tspan><tspan class="pn">:</tspan><tspan x="160" class="str">"The world of IT 👨‍💻"</tspan><tspan class="pn">,</tspan></text>
    <text y="364" class="s" style="animation-delay:4.4s"><tspan x="46" class="key">learning</tspan><tspan class="pn">:</tspan><tspan x="160" class="pn">[</tspan><tspan class="str">"new languages"</tspan><tspan class="pn">, </tspan><tspan class="str">"better code"</tspan><tspan class="pn">],</tspan></text>
    <text y="384" class="s" style="animation-delay:4.55s"><tspan x="46" class="key">lookingFor</tspan><tspan class="pn">:</tspan><tspan x="160" class="str">"Good ideas to build together 🔥"</tspan><tspan class="pn">,</tspan></text>
    <text y="404" class="s" style="animation-delay:4.7s"><tspan x="46" class="key">mindset</tspan><tspan class="pn">:</tspan><tspan x="160" class="str">"I'm on the way 🌱"</tspan><tspan class="pn">,</tspan></text>
    <text y="424" class="s" style="animation-delay:4.85s"><tspan x="46" class="fn">collaborate</tspan><tspan class="pn">:</tspan><tspan x="160" class="pn">() </tspan><tspan class="kw">=&gt;</tspan><tspan class="id"> mail</tspan><tspan class="pn">(</tspan><tspan class="str">"anferomol@protonmail.com"</tspan><tspan class="pn">),</tspan></text>
    <text y="444" class="s" style="animation-delay:5s"><tspan x="28" class="pn">};</tspan></text>

    <!-- 3 · run collaborate() -->
    <g class="s" style="animation-delay:5.5s">
      <text y="472"><tspan x="28" class="p">➜</tspan><tspan x="46" class="c">~</tspan><tspan x="62" class="m">$</tspan><tspan x="80" class="v">node -e "anferomol.collaborate()"</tspan></text>
    </g>
    <g class="t3"><rect x="80" y="458" width="9" height="18" fill="#d4914f" class="h" style="animation-delay:7.4s"/><rect x="89" y="456" width="800" height="22" fill="#0b1619"/></g>

    <g class="s" style="animation-delay:7.5s">
      <g class="h" style="animation-delay:8.9s">
        <g class="spin"><path d="M35 482a7 7 0 1 1-7 7" stroke="#d4914f" stroke-width="2" stroke-linecap="round"/></g>
        <text x="50" y="494" class="m">opening a channel…</text>
      </g>
    </g>
    <text y="494" class="s" style="animation-delay:8.9s"><tspan x="28" class="ok">✔</tspan><tspan x="50" class="v">Ready to build something together → </tspan><tspan class="p">anferomol@protonmail.com</tspan></text>

    <!-- idle prompt -->
    <g class="s" style="animation-delay:9.4s">
      <text y="530"><tspan x="28" class="p">➜</tspan><tspan x="46" class="c">~</tspan><tspan x="62" class="m">$</tspan></text>
      <rect class="blink" x="80" y="516" width="9" height="18" fill="#d4914f"/>
    </g>
  </g>
</svg>
