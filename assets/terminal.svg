<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" fill="none" xml:space="preserve">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c6a5f"/><stop offset="1" stop-color="#6f9a7a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8a868"/><stop offset="1" stop-color="#b8743a"/>
    </linearGradient>
    <linearGradient id="mt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c6a5f"/><stop offset="1" stop-color="#12292a"/>
    </linearGradient>
    <clipPath id="badge"><circle cx="140" cy="215" r="96"/></clipPath>
    <style>
      text{font:14px/1 ui-monospace,SFMono-Regular,"JetBrains Mono",Consolas,monospace}
      .p{fill:#d4914f}.k{fill:#f3e6cc;font-weight:700}.v{fill:#e6ddc9}.m{fill:#5f7d76}.ok{fill:#7fc29b}.c{fill:#8fbfa8}
      .l{opacity:0;animation:in .01s forwards}
      @keyframes in{to{opacity:1}}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .ring{animation:ring 6s ease-in-out infinite alternate}
      @keyframes ring{to{stroke-opacity:.45}}
      .mono{font:400 92px/1 Georgia,"Times New Roman",serif;fill:#f3e6cc}
    </style>
  </defs>

  <rect x="1" y="1" width="858" height="398" rx="16" fill="#0b1619" stroke="#2c6a5f" stroke-opacity=".8" stroke-width="2"/>
  <rect x="1" y="1" width="858" height="40" rx="16" fill="#102024"/>
  <rect x="1" y="26" width="858" height="15" fill="#102024"/>
  <circle cx="26" cy="21" r="6" fill="#d4914f"/><circle cx="46" cy="21" r="6" fill="#6f9a7a"/><circle cx="66" cy="21" r="6" fill="#2c6a5f"/>
  <text x="430" y="26" text-anchor="middle" class="m">anferomol@github: ~</text>

  <g class="l" style="animation-delay:.3s">
    <text x="28" y="74"><tspan class="p">➜ </tspan><tspan class="c">~ </tspan><tspan class="m">$ </tspan><tspan class="v">neofetch --profile</tspan></text>
  </g>

  <!-- logo badge -->
  <g class="l" style="animation-delay:.9s">
    <g clip-path="url(#badge)">
      <rect x="40" y="115" width="200" height="200" fill="#0a1518"/>
      <circle cx="175" cy="180" r="26" fill="url(#sun)"/>
      <path d="M92 168h34M110 160h26" stroke="#d4914f" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M40 290l60-80 30 30 40-60 70 110Z" fill="url(#mt)"/>
      <path d="M40 300q50-30 100-6t100-10V320H40Z" fill="#1f4a47"/>
      <path d="M60 296q40-26 90-4" stroke="#6f9a7a" stroke-width="2" stroke-linecap="round"/>
      <text class="mono" x="140" y="258" text-anchor="middle">AR</text>
      <g transform="translate(140 292)" stroke="#6f9a7a" stroke-width="2" stroke-linecap="round">
        <path d="M0 14V-14M0-8l-6-5M0-8l6-5M0 0l-8-6M0 0l8-6M0 8l-9-6M0 8l9-6"/>
      </g>
    </g>
    <circle class="ring" cx="140" cy="215" r="96" stroke="url(#g)" stroke-width="5"/>
    <circle cx="140" cy="215" r="103" stroke="#2c6a5f" stroke-opacity=".35" stroke-width="1.5"/>
  </g>

  <g transform="translate(290 0)">
    <g class="l" style="animation-delay:1.1s"><text x="0" y="124"><tspan class="k">anferomol</tspan><tspan class="m">@</tspan><tspan class="k">github</tspan></text></g>
    <g class="l" style="animation-delay:1.2s"><text x="0" y="146" class="m">──────────────────────────────</text></g>
    <g class="l" style="animation-delay:1.35s"><text x="0" y="172"><tspan class="c">OS       </tspan><tspan x="80" class="v">Curiosity v∞ (x86_64)</tspan></text></g>
    <g class="l" style="animation-delay:1.5s"><text x="0" y="196"><tspan class="c">Role     </tspan><tspan x="80" class="v">Builder · IT enthusiast</tspan></text></g>
    <g class="l" style="animation-delay:1.65s"><text x="0" y="220"><tspan class="c">Uptime   </tspan><tspan x="80" class="v">Always learning</tspan></text></g>
    <g class="l" style="animation-delay:1.8s"><text x="0" y="244"><tspan class="c">Kernel   </tspan><tspan x="80" class="v">Ideas → Code → Products</tspan></text></g>
    <g class="l" style="animation-delay:1.95s"><text x="0" y="268"><tspan class="c">Shell    </tspan><tspan x="80" class="v">coffee.sh ☕</tspan></text></g>
    <g class="l" style="animation-delay:2.1s"><text x="0" y="292"><tspan class="c">Status   </tspan><tspan x="80" class="ok">● Open to collaborate</tspan></text></g>
    <g class="l" style="animation-delay:2.25s"><text x="0" y="316"><tspan class="c">Contact  </tspan><tspan x="80" class="v">anferomol@pm.me</tspan></text></g>
    <g class="l" style="animation-delay:2.4s">
      <rect x="0" y="332" width="22" height="14" fill="#081114" stroke="#2c6a5f"/><rect x="26" y="332" width="22" height="14" fill="#1b3d3d"/>
      <rect x="52" y="332" width="22" height="14" fill="#2c6a5f"/><rect x="78" y="332" width="22" height="14" fill="#6f9a7a"/>
      <rect x="104" y="332" width="22" height="14" fill="#f3e6cc"/><rect x="130" y="332" width="22" height="14" fill="#d4914f"/>
    </g>
  </g>

  <g class="l" style="animation-delay:2.6s">
    <text x="28" y="378"><tspan class="p">➜ </tspan><tspan class="c">~ </tspan><tspan class="m">$ </tspan></text>
    <rect class="cur" x="82" y="366" width="9" height="16" fill="#d4914f"/>
  </g>
